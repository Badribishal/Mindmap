name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "ERROR: JAVA_HOME is not set." >&2
            exit 1
          fi
          JAVA_MAJOR_VERSION=$(java -version 2>&1 | awk -F '[\"_.-]' '/version/ {if ($2 == "1") print $3; else print $2; exit}')
          echo "Detected Java major version: ${JAVA_MAJOR_VERSION}"
          if [ -z "${JAVA_MAJOR_VERSION}" ] || [ "${JAVA_MAJOR_VERSION}" -lt 17 ]; then
            echo "ERROR: Active Java major version (${JAVA_MAJOR_VERSION:-unknown}) is lower than 17." >&2
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists; skipping generation."
          else
            echo "Generating temporary ./debug.keystore using Java 17 keytool..."
            "${JAVA_HOME}/bin/keytool" -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt >/dev/null 2>&1
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore in the repository root." >&2
            exit 1
          fi
          echo "Confirmed ./debug.keystore is present."

      - name: Build debug APK
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK output
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "${EXPECTED_APK}" ]; then
            echo "Verified expected debug APK exists at: ${EXPECTED_APK}"
          else
            echo "ERROR: Expected debug APK not found at ${EXPECTED_APK}." >&2
            if [ -d "app/build/outputs/apk" ]; then
              echo "Searching inside app/build/outputs/apk for discovered APK files:" >&2
              DISCOVERED_APKS=$(find app/build/outputs/apk -type f -name "*.apk" || true)
              if [ -n "${DISCOVERED_APKS}" ]; then
                echo "${DISCOVERED_APKS}" >&2
              else
                echo "No APK files found inside app/build/outputs/apk." >&2
              fi
            else
              echo "Directory app/build/outputs/apk does not exist." >&2
            fi
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          include-hidden-files: false
